<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grind Glass</title>
<meta name="description" content="Grind: a personal workout log with progress charts, body measurements and progress photos.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm phone column, soft surfaces, floating pill tab bar; sheets slide up for editing */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#EDEFF3; --ink:#101218; --muted:#596070; --line:#E3E5EB;
  --accent:#3346F5; --accent-ink:#FFFFFF; --accent-soft:#E6E9FE;
  --pr:#965206; --pr-soft:#FCEFD9; --good:#0E7A47; --good-soft:#DDF3E7; --danger:#B42318; --danger-soft:#FBE4E2;
  --glass:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(16,18,24,.04),0 6px 24px rgba(16,18,24,.06);
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px; --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C10; --surface:#15171D; --sunk:#1D2028; --ink:#ECEEF3; --muted:#8E94A3; --line:#252833;
  --accent:#8592FF; --accent-ink:#0B0C10; --accent-soft:#1E2246;
  --pr:#F2A43A; --pr-soft:#33260F; --good:#3FCB85; --good-soft:#12291E; --danger:#F27066; --danger-soft:#3A1A18;
  --glass:rgba(21,23,29,.82);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C10; --surface:#15171D; --sunk:#1D2028; --ink:#ECEEF3; --muted:#8E94A3; --line:#252833;
  --accent:#8592FF; --accent-ink:#0B0C10; --accent-soft:#1E2246;
  --pr:#F2A43A; --pr-soft:#33260F; --good:#3FCB85; --good-soft:#12291E; --danger:#F27066; --danger-soft:#3A1A18;
  --glass:rgba(21,23,29,.82);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}
/* the app's own Light / Dark switch wins over the system and the viewer */
:root[data-mode="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#EDEFF3; --ink:#101218; --muted:#596070; --line:#E3E5EB;
  --accent:#3346F5; --accent-ink:#FFFFFF; --accent-soft:#E6E9FE;
  --pr:#965206; --pr-soft:#FCEFD9; --good:#0E7A47; --good-soft:#DDF3E7; --danger:#B42318; --danger-soft:#FBE4E2;
  --glass:rgba(255,255,255,.82);
  --shadow:0 1px 2px rgba(16,18,24,.04),0 6px 24px rgba(16,18,24,.06); color-scheme:light}
:root[data-mode="dark"]{
  --bg:#0B0C10; --surface:#15171D; --sunk:#1D2028; --ink:#ECEEF3; --muted:#8E94A3; --line:#252833;
  --accent:#8592FF; --accent-ink:#0B0C10; --accent-soft:#1E2246;
  --pr:#F2A43A; --pr-soft:#33260F; --good:#3FCB85; --good-soft:#12291E; --danger:#F27066; --danger-soft:#3A1A18;
  --glass:rgba(21,23,29,.82);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
html,body{overflow-x:hidden}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.005em;text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:19px}
.brand{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand i{font-style:normal;color:var(--accent)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{background:var(--surface);border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:16px 12px}
header.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.icon-btn{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.flat{background:transparent;box-shadow:none;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;width:100%;max-width:420px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:24px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:var(--shadow);border:1px solid var(--line)}
nav.tabs button{border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:18px;min-height:50px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.section{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.section>.spread h2{min-width:0}

.btn{border:0;background:var(--sunk);border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:10px}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn svg{width:18px;height:18px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);border:0;white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.chip.ok{background:var(--good-soft);color:var(--good)}

.drag-h{border:0;background:none;color:var(--muted);width:28px;height:36px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none;margin-left:-6px}
.drag-h svg{width:18px;height:18px}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sortable-drag{opacity:.95}

.wk{display:flex;gap:6px;align-items:flex-start}
.wk .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.wk .ex-list{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}

/* live session */
.live-bar{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:12px 16px;border:0;width:100%;text-align:left;font-weight:600}
.live-bar svg{width:18px;height:18px;flex:none}
.live-bar .num{margin-left:auto}
.date-pill{position:relative;display:inline-flex;align-items:center;width:auto;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.date-pill.big{flex:1;justify-content:center;min-height:44px;background:var(--sunk);box-shadow:none;font-size:15px}
.date-pill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;font-size:16px;cursor:pointer}
.ex-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 12px;display:flex;flex-direction:column;gap:10px}
.ex-card .head{display:flex;gap:6px;align-items:flex-start}
.ex-card .head .chip{padding:6px 12px;margin-top:2px}
.ex-card .head .t{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:4px}
.alt{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.prev{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.prev b{color:var(--ink);font-weight:600}
.sets{display:grid;gap:6px}
.set{display:grid;align-items:center;gap:6px}
.set .n{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:center}
.set input{padding:9px 4px;text-align:center;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.set .done{width:44px;height:42px;border-radius:12px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.set .done svg{width:20px;height:20px}
.set .del{width:30px;height:36px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.set .del svg{width:16px;height:16px}
.set .del:hover{color:var(--danger)}
.set input.bad,.meas input.bad{box-shadow:inset 0 0 0 2px var(--danger);color:var(--danger)}
.set.is-done input{background:var(--good-soft);color:var(--good)}
.set.is-done .done{background:var(--good);color:#fff}
.set-head{display:grid;gap:6px;font-size:10px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.tip svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.tip .tx{flex:1;min-width:0;font-size:13px;line-height:1.4}
.tip .tx b{font-weight:600}
.tip.warn{background:var(--pr-soft)}
.tip.warn svg{color:var(--pr)}
.tip .btn{min-height:30px;padding:4px 12px;font-size:12px;flex:none}
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer .in{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:100%}
.timer .t{font-family:var(--f-num);font-size:20px;font-weight:600;min-width:64px}
.timer button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}
.timer.over .in{background:var(--good);color:#fff}

/* autocomplete */
.ac-list{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:340px;overflow-y:auto}
.ac-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.ac-list button:last-child{border-bottom:0}
.ac-list button:hover,.ac-list button:focus-visible{background:var(--sunk)}
.ac-list .nm{min-width:0;display:flex;flex-direction:column}
.ac-list .meta{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.ac-new{padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.mgroups{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.mgroups .chip{padding:6px 12px;font-size:13px}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 0}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:86%}}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan-row{display:flex;gap:6px;align-items:center;background:var(--surface);border-radius:14px;padding:6px 6px 6px 10px}
.plan-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.plan-row input{width:52px;text-align:center;padding:7px 4px;font-size:16px}
.plan-row .icon-btn{width:32px;height:32px;background:transparent;box-shadow:none;color:var(--muted)}
.plan-row .icon-btn svg{width:18px;height:18px}

/* history */
.month{font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.h-item{display:flex;gap:12px;align-items:stretch;width:100%;border:0;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.h-date{width:44px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px;display:flex;flex-direction:column;justify-content:center}
.h-date b{font-family:var(--f-display);font-size:26px;line-height:1}
.h-date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.h-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.h-body .ex-list{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.det-ex{display:flex;flex-direction:column;gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
.det-ex:last-child{border-bottom:0}

/* analytics */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-width:0}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.stat .v small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ma{fill:none;stroke:var(--pr);stroke-width:1.6;stroke-dasharray:4 3}
.chart .ar{fill:var(--accent);fill-opacity:.12;stroke:none}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:1.6}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endl{fill:var(--ink);font-weight:600;font-size:11px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{fill:var(--accent);fill-opacity:.3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:0;border-top:2.2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.ma{border-top:1.6px dashed var(--pr)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:84px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.hbar .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .c{text-align:right;font-family:var(--f-num)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv>div{background:var(--sunk);border-radius:12px;padding:8px 4px}
.kv b{display:block;font-family:var(--f-num);font-size:15px}
.up{color:var(--good)}.down{color:var(--danger)}
.pr-row{display:flex;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.pr-row:last-child{border-bottom:0}
.pr-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}

/* body */
.meas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.meas label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.meas input{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.entries{display:flex;flex-direction:column}
.entry{display:flex;gap:10px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:13px}
.entry:last-child{border-bottom:0}
.entry .d{width:64px;flex:none;font-weight:600}
.entry .vals{flex:1;min-width:0;color:var(--muted);overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--sunk);border:0;padding:0;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:4px;bottom:4px;background:rgba(10,12,16,.65);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.ph.sel{outline:3px solid var(--accent);outline-offset:-3px}
.ph .demo-ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);font-size:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.cmp img{width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover}
.big-photo{width:100%;border-radius:14px}

.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.note{font-size:12px;color:var(--muted)}
.demo-flag{font-size:11px;font-weight:700;color:var(--pr);letter-spacing:.06em;text-transform:uppercase}
.cat-row{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border-radius:14px}
.fieldchips{display:flex;gap:6px;flex-wrap:wrap}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

    w.busy=false})();
}

function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const n=r/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

  if(mn===mx){mn-=1;mx+=1}const step=niceStep((mx-mn)/3);const y0=Math.floor(mn/step)*step,y1=Math.ceil(mx/step)*step;

  let maP='';if(ma&&pts.length>=3){const m=pts.map((p,i)=>{const w=pts.slice(Math.max(0,i-ma+1),i+1);return{t:p.t,v:w.reduce((a,b)=>a+b.v,0)/w.length}});maP=`<path class="ma" d="${m.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('')}"/>`}
  const dots=pts.length<=40?pts.slice(0,-1).map(p=>`<circle class="pt" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"/>`).join(''):'';

function barChart(items,{fmt=v=>fmtN(v,0)}={}){

function acBox(ctx){return `<div><input type="search" maxlength="80" id="ac-${ctx}" data-inp="ac" data-ctx="${ctx}" placeholder="${L('Exercise or muscle, English or Ukrainian','Вправа або мʼяз, українською чи англійською')}" autocomplete="off" autocapitalize="sentences"><div id="acl-${ctx}"></div></div>`}
const norm=s=>String(s||'').toLowerCase().replace(/[’'`ʼ]/g,'').replace(/[-–]/g,' ').replace(/\s+/g,' ').trim();
function searchEx(q,limit=10){
  q=norm(q);if(!q)return[];const words=q.split(' ');const uc=useCount();
  const scored=[];
  for(const e of Object.values(allEx())){
    const hay=[norm(e.name),norm(e.uk),norm(e.muscle),norm(MUSCLE_UK[e.muscle])];
    const all=hay.join(' | ');if(!words.every(w=>all.includes(w)))continue;
    let s=0;if(hay[0].startsWith(q)||hay[1].startsWith(q))s+=4;if(hay[0]===q||hay[1]===q)s+=6;
    if(words.every(w=>hay[0].includes(w)||hay[1].includes(w)))s+=2;
    s+=Math.min(3,(uc.get(e.id)||0)/2);if(!e.builtin)s+=1;else s-=(+e.id.slice(1))/1000;
    scored.push([s,e]);
  }
  return scored.sort((a,b)=>b[0]-a[0]||exName(a[1]).localeCompare(exName(b[1]))).slice(0,limit).map(x=>x[1]);
}
function acRow(e,ctx){const alt=exAlt(e);return `<button data-act="acPick" data-ctx="${ctx}" data-id="${e.id}"><span class="nm"><span>${esc(exName(e))}</span>${alt?`<span class="alt">${esc(alt)}</span>`:''}</span><span class="meta">${esc(muscleName(e.muscle))}<br>${esc(catName(e.cat))}</span></button>`}
function acResults(q,ctx){
  if(!q.trim())return '';
  const hits=searchEx(q,10);const nq=norm(q);
  const exact=Object.values(allEx()).some(e=>norm(e.name)===nq||norm(e.uk)===nq);
  const c=cats();
  return `<div class="ac-list">${hits.map(e=>acRow(e,ctx)).join('')}
    ${exact?'':`<div class="ac-new"><div class="small">${hits.length?L('Not it? ','Не те? '):''}${L('Add','Додати')} «${esc(q.trim())}» ${L('as a new exercise','як нову вправу')}</div>
      <div class="grid2"><select id="new-cat-${ctx}" aria-label="${L('Category','Категорія')}">${Object.entries(c).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('')}</select>
      <select id="new-mus-${ctx}" aria-label="${L('Muscle group','Група мʼязів')}">${MUSCLES.map(m=>`<option value="${m}">${esc(muscleName(m))}</option>`).join('')}</select></div>
      <button class="btn sm primary" data-act="acNew" data-ctx="${ctx}">${ICON.plus}${L('Add to library','Додати в бібліотеку')}</button></div>`}</div>`;
}

function viewAna(){
  const ss=sortedSessions();
  if(!ss.length)return `<div class="empty"><h3>${L('Progress appears after a few workouts','Прогрес зʼявиться після кількох тренувань')}</h3><p>${L('Charts for every exercise, personal records, weekly volume and sets per muscle group.','Графіки по кожній вправі, рекорди, тоннаж за тиждень і підходи на групи мʼязів.')}</p><button class="btn" data-act="demo">${L('Try with sample data','Показати на прикладі')}</button></div>`;
  const t=today(),d30=isoOf(new Date(Date.now()-29*864e5)),mon=monday(t);
  const n30=ss.filter(s=>s.date>=d30).length, volW=ss.filter(s=>s.date>=mon).reduce((a,s)=>a+sessVolume(s),0);
  const weeks=[];for(let i=11;i>=0;i--){const d=dOf(mon);d.setDate(d.getDate()-7*i);weeks.push(isoOf(d))}
  const wCount=weeks.map((w,i)=>{const end=weeks[i+1]||'9999';const list=ss.filter(s=>s.date>=w&&s.date<end);return{label:i%2?'':fmtD(w,{day:'numeric',month:'numeric'}),v:list.length,vol:list.reduce((a,s)=>a+sessVolume(s),0)}});
  const exIds=[...new Set(ss.flatMap(s=>s.items.filter(i=>i.sets.some(hasData)).map(i=>i.exId)))];
  const lastUse=id=>{for(let i=ss.length-1;i>=0;i--)if(ss[i].items.some(x=>x.exId===id))return ss[i].date;return ''};
  exIds.sort((a,b)=>lastUse(b).localeCompare(lastUse(a)));
  if(!exIds.includes(UI.anaEx))UI.anaEx=exIds[0];
  const f=fieldsOf(UI.anaEx),ms=metricsFor(f);if(!ms.find(m=>m[0]===UI.anaMetric))UI.anaMetric=ms[0]?.[0];

  let kv='';if(pts.length){const first=pts[0].v,last=pts.at(-1).v,best=LOWER[met[0]]?Math.min(...pts.map(p=>p.v)):Math.max(...pts.map(p=>p.v));const ch=last-first;const good=LOWER[met[0]]?ch<0:ch>0;
    kv=`<div class="kv"><div><span class="label">${L('Best','Найкраще')}</span><b>${fmtN(best,1)}</b></div><div><span class="label">${L('Latest','Останнє')}</span><b>${fmtN(last,1)}</b></div><div><span class="label">${L('Change','Зміна')}</span><b class="${ch===0?'':good?'up':'down'}">${ch>0?'+':''}${fmtN(ch,1)}</b></div></div>`}

      <div class="stat"><div class="label">${L('Last 30 days','За 30 днів')}</div><div class="v">${n30} <small>${wk}</small></div></div>

      <div class="stat"><div class="label">${L('This week','Цей тиждень')}</div><div class="v">${volW>=1000?fmtN(volW/1000,1)+' <small>'+un('t')+'</small>':fmtN(volW,0)+' <small>'+un('kg')+'</small>'}</div></div></div>
    <div class="section"><h2>${L('Exercise progress','Прогрес у вправі')}</h2><div class="card stack">
      <select id="ana-ex" data-inp="anaEx" aria-label="${L('Exercise','Вправа')}">${exIds.map(id=>`<option value="${id}" ${id===UI.anaEx?'selected':''}>${esc(nameOf(id))}</option>`).join('')}</select>
      ${ms.length>1?`<div class="seg" role="group" aria-label="${L('Metric','Показник')}"><i class="thumb" aria-hidden="true"></i>${ms.map(m=>`<button data-act="anaMetric" data-v="${m[0]}" aria-pressed="${m[0]===met[0]}">${m[1]}</button>`).join('')}</div>`:''}
      ${met?`<div class="spread"><span class="label">${met[1]}${met[2]?', '+un(met[2]):''}</span><span class="note">${PW(pts.length)}</span></div>${lineChart(pts)}${kv}`:''}

/* ---------- DOM patching: update only what changed ---------- */
function patch(el,html){
  if(!window.morphdom){el.innerHTML=html;return}
  const tmp=el.cloneNode(false);tmp.innerHTML=html;
  morphdom(el,tmp,{childrenOnly:true,
    getNodeKey:n=>n.id||(n.dataset&&n.dataset.key)||null,
    onBeforeElUpdated:(from,to)=>{
      if(from.classList&&from.classList.contains('thumb'))return false;
      if(from.isEqualNode(to))return false;
      if(from===document.activeElement&&(from.tagName==='INPUT'||from.tagName==='TEXTAREA')&&from.type!=='date'&&from.type!=='file'){
        for(const a of to.attributes)if(a.name!=='value')from.setAttribute(a.name,a.value);return false}
      return true}});
}

/* ---------- sliding selection (segmented controls, tab bar) ---------- */
function syncThumbs(){document.querySelectorAll('.seg,nav.tabs .in').forEach(c=>{
  const t=c.querySelector(':scope>.thumb');if(!t)return;const a=c.querySelector(':scope>[aria-pressed="true"],:scope>[aria-current="page"]');
  if(!a){t.style.opacity=0;return}const first=!t.dataset.on;if(first)t.style.transition='none';
  t.style.width=a.offsetWidth+'px';t.style.height=a.offsetHeight+'px';t.style.transform=`translate(${a.offsetLeft}px,${a.offsetTop}px)`;t.style.opacity=1;t.dataset.on=1;
  if(first){void t.offsetWidth;t.style.transition=''}})}
addEventListener('resize',()=>{document.querySelectorAll('.thumb').forEach(t=>delete t.dataset.on);syncThumbs()});
document.fonts&&document.fonts.ready.then(()=>{document.querySelectorAll('.thumb').forEach(t=>delete t.dataset.on);syncThumbs()});
document.addEventListener('touchstart',()=>{},{passive:true});

/* ---------- drag to reorder ---------- */
function makeSort(el,onMove){
  if(!el||!window.Sortable||el.__sortable)return;
  el.__sortable=true;
  Sortable.create(el,{handle:'.drag-h',draggable:'.sort-item',animation:160,fallbackTolerance:4,
    onEnd:e=>{const a=e.oldDraggableIndex,b=e.newDraggableIndex;if(a==null||b==null||a===b)return;onMove(a,b)}});
}
function initSort(){
  makeSort(document.getElementById('live-list'),(a,b)=>{move(UI.draft.items,a,b);saveDraft();render()});
  makeSort(document.getElementById('wk-cards'),(a,b)=>{const arr=sortedWk();move(arr,a,b);arr.forEach((w,i)=>w.order=i);persist('workouts');render()});
}

/* ---------- timer ---------- */
function renderTimer(){
  const r=document.getElementById('timer-root');const t=UI.timer;
  if(!t||!UI.draft){r.innerHTML='';return}
  const left=(t.end-Date.now())/1000;
  patch(r,`<div class="timer${left<=0?' over':''}"><div class="in"><span class="small">${left>0?L('Rest','Відпочинок'):L('Go!','Час!')}</span><span class="t">${left>0?fmtClock(left):'+'+fmtClock(-left)}</span><button data-act="tAdd">+15 ${un('s')}</button><button data-act="tStop">${L('Stop','Стоп')}</button></div></div>`);
}
setInterval(()=>{
  if(UI.timer)renderTimer();
  if(UI.timer&&UI.timer.end-Date.now()<-60000){UI.timer=null;renderTimer()}
  if(UI.draft&&!UI.draft.editing)document.querySelectorAll('[data-elapsed]').forEach(e=>e.textContent=fmtClock((Date.now()-UI.draft.startedAt)/1000));
},1000);
let wake=null;async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}if(!on&&wake){await wake.release();wake=null}}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UI.draft&&!UI.draft.editing)keepAwake(true)});

/* ---------- swipe any sheet down to close ---------- */
(()=>{let d=null;
  const begin=(sh,y,x)=>({sh,y0:y,x0:x,y,t:performance.now(),v:0,on:false});
  const move=(e,y,x)=>{if(!d)return;const dy=y-d.y0,dx=x-d.x0;
    if(!d.on){if(Math.abs(dy)<8&&Math.abs(dx)<8)return;
      if(dy<0||d.sh.scrollTop>0||Math.abs(dx)>Math.abs(dy)){d=null;return}
      d.on=true;d.y0=y;d.sh.classList.remove('settle');d.sh.classList.add('dragging');document.activeElement?.blur?.()}
    if(e.cancelable)e.preventDefault();const now=performance.now();const off=Math.max(0,y-d.y0);
    d.v=(y-d.y)/Math.max(1,now-d.t);d.y=y;d.t=now;
    d.sh.style.transform=`translateY(${off<0?0:off}px)`;d.sh.parentElement.style.background=`rgba(5,8,16,${Math.max(0,.28*(1-off/400))})`};
  const end=()=>{if(!d)return;const {sh,on}=d;const off=Math.max(0,d.y-d.y0);const v=d.v;d=null;if(!on)return;
    sh.classList.remove('dragging');window.__dragJustEnded=Date.now();
    if(off>110||(v>.5&&off>20))closeModal();
    else{sh.classList.add('settle');sh.style.transform='';sh.parentElement.style.background='';setTimeout(()=>sh.classList.remove('settle'),380)}};
  document.addEventListener('touchstart',e=>{const sh=e.target.closest('.sheet');if(!sh||e.touches.length>1)return;const t=e.touches[0];d=begin(sh,t.clientY,t.clientX)},{passive:true});
  document.addEventListener('touchmove',e=>{if(!d)return;const t=e.touches[0];move(e,t.clientY,t.clientX)},{passive:false});
  document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
  document.addEventListener('mousedown',e=>{const sh=e.target.closest('.sheet');if(!sh||e.target.closest('input,textarea,select'))return;d=begin(sh,e.clientY,e.clientX)});
  document.addEventListener('mousemove',e=>{if(d)move(e,e.clientY,e.clientX)});
  document.addEventListener('mouseup',end);
  document.addEventListener('click',e=>{if(window.__dragJustEnded&&Date.now()-window.__dragJustEnded<300){e.stopPropagation();e.preventDefault()}},true);
})();

  const pop=root.querySelector('.pop');const pw=pop.offsetWidth,ph=pop.offsetHeight,vw=innerWidth,vh=innerHeight;
  let left=Math.max(12,Math.min(r.right-pw,vw-pw-12));let top=r.bottom+8,up=false;

  pop.style.left=left+'px';pop.style.top=top+'px';pop.style.transformOrigin=`${Math.round(r.left+r.width/2-left)}px ${up?ph:0}px`;

function finishDraft(mode){
  const d=UI.draft;
  for(const [ii,it] of d.items.entries())for(const [si,st] of it.sets.entries())for(const k of fieldsOf(it.exId))if(badField(k,st[k])){
    toast(L(`Check ${nameOf(it.exId)}, set ${si+1}: “${st[k]}” isn’t a valid ${fl(k).toLowerCase()}.`,`Перевір ${nameOf(it.exId)}, підхід ${si+1}: «${st[k]}» не підходить для поля «${fl(k)}».`));
    const el=document.getElementById(`i-${ii}-${si}-${k}`);el?.focus();el?.scrollIntoView({block:'center'});return}
  for(const it of d.items)it.sets=it.sets.filter(st=>!(fieldsOf(it.exId).includes('reps')&&num(st.reps)===0&&!Object.keys(FIELDS).some(k=>k!=='reps'&&k!=='weight'&&num(st[k])>0)));
  const all=d.items.flatMap(i=>i.sets.filter(hasData));
  if(!all.length){openModal({type:'confirm',ok:true,title:L('No sets logged','Немає жодного підходу'),text:L('Fill in at least one set, or cancel the workout.','Заповни хоча б один підхід або скасуй тренування.'),yes:'OK',onYes:()=>{}});return}
  const undone=all.filter(s=>!s.done).length;
  if(!mode&&undone&&!d.editing){openModal({type:'finishAsk',undone,doneN:all.length-undone});return}
  const keep=s=>hasData(s)&&(mode!=='done'||s.done);
  const items=d.items.map(i=>({exId:i.exId,sets:i.sets.filter(keep).map(s=>{const o={};for(const k of Object.keys(FIELDS))if(num(s[k])!=null)o[k]=num(s[k]);return o})})).filter(i=>i.sets.length);
  const old=S.sessions[d.id];
  const s={id:d.id,workoutId:d.workoutId,name:d.name,quick:!!d.quick,date:d.date,startedAt:d.startedAt,endedAt:d.editing?(old?.endedAt??null):Date.now(),note:d.note||'',items};
  if(old?.demo)s.demo=true;
  S.sessions[s.id]=s;persistSession(s.id);
  const wasEdit=d.editing;UI.draft=null;UI.timer=null;saveDraft();keepAwake(false);UI.tab='hist';render();
  if(!wasEdit)openModal({type:'summary',id:s.id});else toast(L('Changes saved','Зміни збережено'));
}

async function compress(file,maxSide,q){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',q));}finally{URL.revokeObjectURL(url)}
}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

    else{let b=await compress(file,720,.72);let du=await blobToData(b);if(du.length>230000){b=await compress(file,520,.6);du=await blobToData(b)}p.dataUrl=du}

}

    demo(){closeModal();demoFill();render()},
    demoClear(){openModal({type:'confirm',title:L('Remove sample data?','Прибрати приклад?'),text:L('Workouts, templates and measurements marked “sample” will be deleted. Your own entries stay.','Буде видалено тренування, шаблони і заміри з позначкою «приклад». Твої записи залишаться.'),yes:L('Remove','Прибрати'),danger:true,onYes:demoClear})},
    wipe(){openModal({type:'confirm',title:L('Erase everything?','Стерти все?'),text:L('All workouts, templates, measurements, photos and your own exercises will be deleted. This can’t be undone. Export first if you need the data.','Буде видалено всі тренування, шаблони, заміри, фото і твої вправи. Це не можна скасувати. Спершу зроби експорт, якщо дані потрібні.'),yes:L('Erase everything','Стерти все'),danger:true,onYes:()=>{
      for(const id of Object.keys(S.sessions)){delete S.sessions[id];persistSession(id)}
      for(const [id,p] of Object.entries(S.photos)){if(p.assetId&&ASSETS)ASSETS.delete(p.assetId).catch(()=>{});delete S.photos[id];persistPhoto(id)}
      const keep={theme:S.lib.settings?.theme||'system',lang:lang()};const E=EMPTY();S.lib=E.lib;Object.assign(S.lib.settings,keep);S.workouts=E.workouts;S.body=E.body;persist('lib');persist('workouts');persist('body');toast(L('Everything erased','Усе стерто'))}})},
    theme(){S.lib.settings={...(S.lib.settings||{}),theme:ds.v};ls.set('grind_theme',ds.v);applyTheme(ds.v);persist('lib');UI.modal.keep=true;renderModal()},
    lang(){S.lib.settings={...(S.lib.settings||{}),lang:ds.v};persist('lib');UI.modal.keep=true;render()},
    newWk(){openModal({type:'wk',isNew:true,w:{id:'w'+rid(),name:'',exercises:[],order:-1}})},
    editWk(){openModal({type:'wk',w:clone(S.workouts.items[ds.id])})},
    wkDel(){UI.modal.w.exercises.splice(+ds.i,1);UI.modal.keep=true;renderModal()},
    wkSave(){const w=UI.modal.w;w.name=w.name.trim().slice(0,60)||L('Workout','Тренування');delete w.days;S.workouts.items[w.id]=w;sortedWk().forEach((x,i)=>x.order=i);persist('workouts');closeModal();render()},
    wkRemove(){const w=UI.modal.w;openModal({type:'confirm',title:L(`Delete “${w.name}”?`,`Видалити «${w.name}»?`),text:L('The workout template will be deleted. Your history of finished workouts stays.','Шаблон тренування буде видалено. Історія виконаних тренувань залишиться.'),yes:L('Delete','Видалити'),danger:true,onYes:()=>{delete S.workouts.items[w.id];persist('workouts')}})},
    start(){if(UI.draft){UI.tab='live';render();toast(L('Finish the current workout first','Спершу заверши поточне тренування'));return}startWorkout(ds.id)},
    acPick(){pickEx(ds.ctx,ds.id)},
    acNew(){const inp=document.getElementById('ac-'+ds.ctx);let n=inp.value.trim();if(!n)return;n=n.charAt(0).toUpperCase()+n.slice(1);
      const id=createCustomEx(n,document.getElementById('new-cat-'+ds.ctx).value,document.getElementById('new-mus-'+ds.ctx).value);pickEx(ds.ctx,id);toast(L('Exercise added to your library','Вправу додано в бібліотеку'))},
    done(){const it=UI.draft.items[+ds.i];const s=it.sets[+ds.s];
      if(!s.done&&!hasData(s)){toast(L('Enter the numbers for this set first','Спершу введи цифри для цього підходу'));document.getElementById(`i-${ds.i}-${ds.s}-${fieldsOf(it.exId)[0]}`)?.focus();return}
      s.done=!s.done;saveDraft();
      if(s.done&&!UI.draft.editing){const r=+(S.lib.settings?.rest??90);if(r>0)UI.timer={end:Date.now()+r*1000}}
      render()},
    delSet(){const it=UI.draft.items[+ds.i];it.sets.splice(+ds.s,1);saveDraft();render()},
    addSet(){const it=UI.draft.items[+ds.i];const last=it.sets.at(-1);it.sets.push(last&&hasData(last)?(({done,...o})=>o)(clone(last)):{});saveDraft();render();
      const f=fieldsOf(it.exId);document.getElementById(`i-${ds.i}-${it.sets.length-1}-${f[0]}`)?.focus()},
    useTip(){const it=UI.draft.items[+ds.i];const tip=hintFor(it.exId,UI.draft.id);if(!tip?.fill)return;
      const doneSets=it.sets.filter(s=>s.done);const rest=tip.fill.slice(doneSets.length).map(x=>({...x}));
      it.sets=[...doneSets,...rest];if(!rest.length)it.sets.push({...tip.fill.at(-1)});saveDraft();render();toast(L('Target filled in. Adjust if needed.','Ціль вписано. Зміни, якщо треба.'))},
    exMenu(){openModal({type:'exMenu',i:+ds.i})},
    setCat(){const id=ds.id;S.lib.ex[id]={...(S.lib.ex[id]||{}),cat:ds.v};persist('lib');if(UI.modal)UI.modal.keep=true;render()},
    exRemove(){UI.draft.items.splice(+ds.i,1);saveDraft();closeModal();render()},
    finish(){finishDraft()},
    discard(){const ed=UI.draft.editing;openModal({type:'confirm',title:ed?L('Discard changes?','Скасувати зміни?'):L('Cancel this workout?','Скасувати тренування?'),text:ed?L('The saved version of the workout stays as it was.','Збережена версія тренування залишиться без змін.'):L('All sets logged in this workout will be lost.','Усі підходи цього тренування буде втрачено.'),yes:ed?L('Discard changes','Скасувати зміни'):L('Cancel workout','Скасувати тренування'),danger:true,onYes:()=>{UI.draft=null;UI.timer=null;saveDraft();keepAwake(false);UI.tab=ed?'hist':'train'}})},
    tAdd(){if(UI.timer)UI.timer.end+=15000;renderTimer()},
    tStop(){UI.timer=null;renderTimer()},
    openSess(){openModal({type:'sess',id:ds.id})},
    sessDel(){const id=ds.id;openModal({type:'confirm',title:L('Delete this workout?','Видалити тренування?'),text:L('It will be removed from history and progress, with all its sets.','Його буде видалено з історії та прогресу разом з усіма підходами.'),yes:L('Delete','Видалити'),danger:true,onYes:()=>{delete S.sessions[id];persistSession(id)}})},
    sessEdit(){if(UI.draft){closeModal();toast(L('Finish the current workout first','Спершу заверши поточне тренування'));return}const s=clone(S.sessions[ds.id]);UI.draft={...s,editing:true,items:s.items.map(i=>({exId:i.exId,sets:i.sets.map(x=>({...x,done:true}))}))};saveDraft();closeModal();UI.tab='live';render();window.scrollTo(0,0)},
    anaMetric(){UI.anaMetric=ds.v;render()},
    bodyMetric(){UI.bodyMetric=ds.v;render()},
    saveBody(){const d=UI.bodyDate||today();const e={};
      const wrong=BODY_FIELDS.find(([k])=>badBody(k,document.getElementById('b-'+k).value));
      if(wrong){toast(L(`Check ${wrong[1].toLowerCase()}: that value looks wrong.`,`Перевір поле «${bl(wrong[0],wrong[1])}»: значення виглядає неправильним.`));document.getElementById('b-'+wrong[0]).focus();return}BODY_FIELDS.forEach(([k])=>{const v=num(document.getElementById('b-'+k).value);if(v!=null)e[k]=v});
      if(!Object.keys(e).length){if(S.body.entries[d]){delete S.body.entries[d];persist('body');toast(L('Entry deleted','Запис видалено'));render()}else toast(L('Enter at least one value','Введи хоча б одне значення'));return}
      const old=S.body.entries[d];if(old&&num(old.fat)!=null)e.fat=old.fat;S.body.entries[d]=e;persist('body');toast(L('Saved','Збережено'));render()},
    editBody(){UI.bodyDate=ds.d;render();window.scrollTo({top:0,behavior:'smooth'})},
    cmpMode(){UI.cmpMode=!UI.cmpMode;UI.compare=[];render()},
    openPhoto(){if(UI.cmpMode){const id=ds.id;UI.compare=UI.compare.includes(id)?UI.compare.filter(x=>x!==id):[...UI.compare,id].slice(-2);
        if(UI.compare.length===2){openModal({type:'compare',ids:UI.compare.slice()});UI.compare=[];UI.cmpMode=false}render();return}
      openModal({type:'photo',id:ds.id})},
    photoDel(){const id=ds.id;openModal({type:'confirm',title:L('Delete this photo?','Видалити фото?'),text:L('The photo will be deleted for good.','Фото буде видалено назавжди.'),yes:L('Delete','Видалити'),danger:true,onYes:()=>{const p=S.photos[id];if(p?.assetId&&ASSETS)ASSETS.delete(p.assetId).catch(()=>{});delete S.photos[id];persistPhoto(id)}})},
    catField(){const k=ds.k,f=ds.v;const c=cats()[k];let fl2=c.fields.includes(f)?c.fields.filter(x=>x!==f):[...c.fields,f];if(!fl2.length){toast(L('A category needs at least one field','Категорії потрібне хоча б одне поле'));return}
      fl2=Object.keys(FIELDS).filter(x=>fl2.includes(x));S.lib.cats[k]={...(S.lib.cats[k]||{}),fields:fl2};persist('lib');UI.modal.keep=true;renderModal()},
    catAdd(){const k='k'+rid();S.lib.cats[k]={name:L('New category','Нова категорія'),fields:['weight','reps']};persist('lib');UI.modal.keep=true;renderModal()},
    catDel(){const k=ds.k;S.lib.cats[k]={...(S.lib.cats[k]||{}),deleted:true};persist('lib');UI.modal.keep=true;renderModal()},
    exDelLib(){const id=ds.id;const used=Object.values(S.sessions).some(s=>s.items.some(i=>i.exId===id));
      openModal({type:'confirm',title:L('Delete from library?','Видалити з бібліотеки?'),text:used?L('This exercise is in your history. Those records stay, but it won’t be suggested any more.','Ця вправа є в історії. Записи залишаться, але в підказках її більше не буде.'):L('It won’t be suggested any more.','У підказках її більше не буде.'),yes:L('Delete','Видалити'),danger:true,onYes:()=>{S.lib.ex[id]={...S.lib.ex[id],deleted:true};persist('lib')}})},
    export(){closeModal();exportData()},
    copyExp(){const t=document.getElementById('exp-text');navigator.clipboard.writeText(t.value).then(()=>toast(L('Copied','Скопійовано'))).catch(()=>{t.select();toast(L('Selected. Copy it manually.','Виділено. Скопіюй вручну.'))})},
  };
  if(A[a]){e.preventDefault();A[a]()}
});
function pickEx(ctx,id){
  if(ctx==='live'){addExToDraft(id);render()}
  else if(ctx==='wk'){const w=UI.modal.w;if(!w.exercises.some(e=>e.exId===id))w.exercises.push({exId:id,sets:3});UI.modal.keep=true;renderModal();document.getElementById('ac-wk')?.focus()}
}
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.inp;if(!k)return;
  if(k==='ac'){document.getElementById('acl-'+el.dataset.ctx).innerHTML=acResults(el.value,el.dataset.ctx);return}
  if(k==='brq'){UI.modal.q=el.value;const pos=el.selectionStart;UI.modal.keep=true;renderModal();const n=document.getElementById('br-q');n.focus();try{n.setSelectionRange(pos,pos)}catch{}return}
  if(k==='set'){const s=UI.draft.items[+el.dataset.i].sets[+el.dataset.s];s[el.dataset.k]=el.value;el.classList.toggle('bad',badField(el.dataset.k,el.value));saveDraft();return}
  if(k==='note'){UI.draft.note=el.value;saveDraft();return}
  if(k==='wkName'){UI.modal.w.name=el.value;return}
  if(k==='wkSets'){const n=parseInt(el.value);UI.modal.w.exercises[+el.dataset.i].sets=isNaN(n)?null:Math.min(20,Math.max(1,n));return}
});
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.inp;if(!k)return;
  if(k==='anaEx'){UI.anaEx=el.value;UI.anaMetric=null;render()}
  if(k==='bdate'){if(el.value>today()){toast(L('The date can’t be in the future','Дата не може бути в майбутньому'));render();return}UI.bodyDate=el.value||today();render()}
  if(k==='phdate'){if(el.value>today()){toast(L('The date can’t be in the future','Дата не може бути в майбутньому'));render();return}UI.photoDate=el.value||today();render()}
  if(k==='ddate'){if(el.value>today()){el.value=UI.draft.date;toast(L('The date can’t be in the future','Дата не може бути в майбутньому'));return}if(el.value){UI.draft.date=el.value;saveDraft();render();toast(L('Date set to ','Дата: ')+fmtD(el.value,{weekday:'long',day:'numeric',month:'long'}))}else el.value=UI.draft.date}
  if(k==='photo'&&el.files[0]){addPhoto(el.files[0]);el.value=''}
  if(k==='import'&&el.files[0]){importData(el.files[0]);el.value=''}
  if(k==='rest'){const n=parseInt(el.value);S.lib.settings={...(S.lib.settings||{}),rest:isNaN(n)?90:Math.max(0,Math.min(900,n))};persist('lib')}
  if(k==='catName'){const c=cats()[el.dataset.k];S.lib.cats[el.dataset.k]={...(S.lib.cats[el.dataset.k]||{}),name:el.value.trim()||c.name};persist('lib')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.querySelector('#pop-root .pop')){closePop();return}
  if(e.key==='Escape'&&UI.modal){closeModal()}
  if(e.key==='Enter'&&e.target.dataset.inp==='ac'){const first=document.querySelector(`#acl-${e.target.dataset.ctx} [data-act="acPick"]`);if(first){e.preventDefault();first.click()}}
});

applyTheme();renderTabs();boot();
</script>
</body>
</html>
